[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aikernel-providers"
version = "0.1.2"
description = "Python wrapper for AIKernel.Providers v0.1.2 official extension providers with bundled managed assemblies and pythonnet loading."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Takuya Sogawa" }
]
dependencies = [
  "pythonnet>=3.0.5"
]
keywords = [
  "aikernel",
  "providers",
  "official-provider-set",
  "openai",
  "microsoft-ai",
  "cuda",
  "local-llm",
  "semantic-runtime",
  "managed-assemblies",
  "pythonnet"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries"
]

[project.optional-dependencies]
test = [
  "pytest>=9.0"
]

[project.urls]
Homepage = "https://github.com/AIKernel-NET/AIKernel.Providers"
Repository = "https://github.com/AIKernel-NET/AIKernel.Providers"
Documentation = "https://aikernel.net/reference/"
Issues = "https://github.com/AIKernel-NET/AIKernel.Providers/issues"
Releases = "https://github.com/AIKernel-NET/AIKernel.Providers/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aikernel_providers = ["native/*.dll", "native/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
